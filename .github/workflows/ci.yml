name: CI

# No branches filter on pull_request: stacked PRs target another step's branch.
on:
  pull_request: {}
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: choreganizer
          POSTGRES_PASSWORD: choreganizer
          POSTGRES_DB: choreganizer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The Vitest global setup migrates this database before the tests run.
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://choreganizer:choreganizer@localhost:5432/choreganizer_test
